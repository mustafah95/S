# Sofia's Resto-Lounge — dedicated server / cloud deployment.
#   cd deploy && ./generate-env.sh > .env && docker compose up -d
# PostgreSQL is only on the internal "backend" network: it is never published to the host or the internet.
name: sofia

x-app: &app
  build:
    context: ..
    dockerfile: deploy/docker/Dockerfile
  image: sofia/resto-lounge:${SOFIA_VERSION:-1.0.0}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://sofia_app:${SOFIA_DB_APP_PASSWORD}@postgres:5432/sofia
    DATABASE_OWNER_URL: postgres://sofia_owner:${SOFIA_DB_OWNER_PASSWORD}@postgres:5432/sofia
    SOFIA_DB_APP_ROLE: sofia_app
    SOFIA_TRUST_PROXY: "true"
    SOFIA_EMBEDDED_WORKER: "false"
    SOFIA_UPDATE_PUBLIC_KEY_FILE: /run/sofia/update-public-key.pem
  volumes:
    - sofia:/opt/sofia
    - ./update-public-key.pem:/run/sofia/update-public-key.pem:ro
  depends_on:
    postgres:
      condition: service_healthy
  networks: [backend, frontend]

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: sofia
      POSTGRES_USER: sofia_owner
      POSTGRES_PASSWORD: ${SOFIA_DB_OWNER_PASSWORD:?run generate-env.sh}
      SOFIA_DB_APP_PASSWORD: ${SOFIA_DB_APP_PASSWORD:?run generate-env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofia_owner -d sofia"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    <<: *app
    command: ["api"]

  worker:
    <<: *app
    command: ["worker"]

  updater:
    <<: *app
    command: ["updater"]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      SOFIA_SITE_ADDRESS: ${SOFIA_SITE_ADDRESS:-:80}
      SOFIA_ACME_EMAIL: ${SOFIA_ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [frontend]

volumes:
  pgdata:
  sofia:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  frontend:
